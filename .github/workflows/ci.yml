name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pizza_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Redis efemero (Sprint 3) -- sem isso, RedisCacheService nunca roda de verdade em
      # lugar nenhum (o fallback in-memory e' o unico caminho exercitado), e um bug real de
      # serializacao/TTL so' apareceria em producao. Nao precisa de conta/secret, imagem
      # padrao sem auth, mesmo padrao "infra efemera barata" do postgres acima.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pizza_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/pizza_ci
      APP_DB_ROLE: pizza_app
      APP_DB_PASSWORD: pizza_app_ci_password
      JWT_SECRET: ci_only_access_secret_never_used_outside_ci
      JWT_REFRESH_SECRET: ci_only_refresh_secret_different_from_access
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sem "version:" aqui de proposito — a action le a versao do campo "packageManager"
      # do package.json raiz. Especificar as duas ao mesmo tempo faz a action recusar
      # rodar (ERR_PNPM_BAD_PM_VERSION).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (workspace root)
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        working-directory: apps/api
        run: pnpm prisma:generate

      - name: Run migrations (schema + RLS + CHECK)
        working-directory: apps/api
        run: pnpm prisma:migrate:deploy

      - name: RLS gate — fail build if any tenant_id table lacks ENABLE+FORCE RLS
        run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f scripts/check-rls.sql

      - name: Create restricted app role (NOSUPERUSER NOBYPASSRLS)
        working-directory: apps/api
        run: pnpm db:setup-role

      - name: Isolation / e2e tests — run as the restricted role, never as superuser
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://pizza_app:pizza_app_ci_password@localhost:5432/pizza_ci
        run: pnpm test:e2e

      - name: Unit tests
        working-directory: apps/api
        run: pnpm test
